<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Welcome back</title>
    <style>body {margin:0; overflow:hidden; background:#2d060d;}</style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  </head>
  <body>
    <script>
      // Paleta de colores extraída
      const palette = {
        oscuro: "#2d060d",
        crema: "#e0e6e0",
        violeta: "#5a454e",
        rojo: "#ae2f2d",
        burdeos: "#63161b",
        beige: "#9a847f"
      };

      let tentacles = [];
      const numTentacles = 8;
      let heartVisible = true;
      let beatCount = 0;
      let beating = true;
      let fade = 255;
      let heartTimer = 0;
      let lastBeat = 0;

      function setup() {
        createCanvas(windowWidth, windowHeight);
        angleMode(DEGREES);

        for (let i = 0; i < numTentacles; i++) {
          tentacles.push(new Tentacle(
            width/2, height/2,
            random(120, 220),
            random(7, 11),
            random(7, 17),
            i * (360/numTentacles)
          ));
        }
      }

      function draw() {
        background(palette.oscuro);

        // Dibujar tentáculos
        for (let t of tentacles) {
          t.update();
          t.display();
        }

        // Animación del corazón
        if (heartVisible) {
          animateHeart();
        }
      }

      function animateHeart() {
        // Tres latidos muy lentos (3 segundos por latido)
        let now = millis();
        if (beating && now - lastBeat > 3000) {
          beatCount++;
          lastBeat = now;
        }
        if (beatCount > 3) {
          beating = false;
        }

        // Escala del corazón
        let beatScale = 12;
        if (beating) {
          let phase = ((now - lastBeat) % 3000) / 3000.0;
          beatScale = 1 + 0.15 * sin(phase * 360);
        } 

        if (!beating) {
          // Empieza a desvanecerse
          fade -= 1.2;
          if (fade <= 0) {
            heartVisible = false;
          }
        }

        push();
        translate(width/2, height/2);
        scale(beatScale);
        drawHeart(fade);
        pop();
      }

      function drawHeart(alpha = 255) {
        noStroke();
        // Sombra
        fill(0, 70);
        ellipse(0, 22, 70, 20);

        // Cuerpo del corazón
        fill(color(palette.rojo + hex(floor(alpha), 2))); // Gradual alpha
        beginShape();
        vertex(0, 0);
        bezierVertex(-44, -36, -60, 18, 0, 40);
        bezierVertex(60, 18, 44, -36, 0, 0);
        endShape(CLOSE);

        // Reflejo suave
        fill(255, 160, 160, alpha * 0.25);
        ellipse(-14, -7, 15, 8);

        // Detalle central (luz)
        fill(palette.crema + hex(floor(alpha * 0.7), 2));
        ellipse(0, 6, 10, 5);
      }

      class Tentacle {
        constructor(x, y, len, segments, amp, startAngle) {
          this.base = createVector(x, y);
          this.len = len;
          this.segments = segments;
          this.amp = amp;
          this.startAngle = startAngle;
          this.offset = random(1000);
          this.colors = [
            palette.burdeos,
            palette.violeta,
            palette.beige,
            palette.oscuro
          ];
        }

        update() {
          this.offset += 0.01 + random(0.005);
        }

        display() {
          push();
          translate(this.base.x, this.base.y);
          let angleStep = 30;
          let px = 0, py = 0;
          strokeWeight(15);
          noFill();
          for (let i = 0; i < this.segments; i++) {
            let theta = this.startAngle + sin(frameCount*0.8 + this.offset*60 + i*15) * this.amp;
            let lenStep = this.len / this.segments;
            let nx = px + cos(theta) * lenStep;
            let ny = py + sin(theta) * lenStep;
            stroke(color(this.colors[i % this.colors.length]));
            line(px, py, nx, ny);
            // aros decorativos de color crema
            if (i % 2 === 0 && random(1) > 0.8) {
              stroke(palette.crema + '55');
              strokeWeight(5);
              ellipse(nx, ny, 12, 4);
              strokeWeight(15);
              stroke(color(this.colors[i % this.colors.length]));
            }
            px = nx;
            py = ny;
          }
          pop();
        }
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }

    </script>
  </body>
</html>
